<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <title>设计需求发布平台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css?v44" />
  <!-- 【v44】Service Worker 尽早注册：在首屏资源下载的同时开始预缓存，二次访问静态资源秒开 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function () {});
    }
  </script>
</head>
<body>
  <!-- 启动遮罩 -->
  <div id="bootSplash" class="boot-splash">
    <div class="boot-card">
      <div class="boot-brand">🎨 设计需求发布平台</div>
      <div class="boot-sub">加载中…</div>
    </div>
  </div>

  <!-- 登录 / 注册 -->
  <div id="authScreen" class="auth-screen" style="display:none">
    <div class="auth-card">
      <div class="auth-brand">🎨 设计需求发布平台</div>
      <div class="auth-sub" id="authSub">注册用户发布需求 · 设计师抢单</div>
      <div class="seg">
        <button class="seg-btn active" data-mode="login">登录</button>
        <button class="seg-btn" data-mode="register">注册</button>
      </div>
      <input id="authEmail" type="email" placeholder="邮箱" autocomplete="username" />
      <div class="pwd-wrap">
        <input id="authPwd" type="password" placeholder="密码（≥6 位）" autocomplete="current-password" />
        <button id="authPwdToggle" class="pwd-toggle" type="button" title="显示/隐藏密码">👁</button>
      </div>
      <input id="authRealName" type="text" placeholder="真实姓名" style="display:none" autocomplete="name" />
      <label class="remember-row">
        <input id="authRemember" type="checkbox" checked />
        <span>记住账号密码</span>
      </label>
      <button id="authSubmit" class="btn btn-primary">登录</button>
      <div id="authHint" class="auth-hint"></div>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="app" class="app" style="display:none">
    <header class="topbar">
      <div class="topbar-title">需求大厅</div>
      <div class="topbar-right">
        <button id="btnInbox" class="icon-btn" title="我的消息">
          📨<span id="inboxDot" class="red-dot" hidden></span>
        </button>
        <div id="userChip" class="user-chip">
          <span id="userAvatar" class="avatar-sm"></span>
          <span id="userName"></span>
        </div>
        <button id="btnSignOut" class="btn-ghost">退出</button>
      </div>
    </header>
    <!-- PWA 安装引导（浏览器触发 beforeinstallprompt 时显示，可主动安装到桌面） -->
    <div id="installBanner" class="install-banner" style="display:none">
      <span class="install-text">📱 安装到桌面，打开更快</span>
      <button id="installBtn" class="btn btn-sm btn-primary">安装</button>
      <button id="installClose" class="btn-ghost" title="忽略">✕</button>
    </div>

    <main id="tabContent" class="tab-content"></main>

    <!-- 底部 Tab -->
    <nav id="tabs" class="tabs">
      <button class="tab-btn active" data-tab="board"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>大厅</button>
      <button class="tab-btn" data-tab="mine"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>我发布的</button>
      <button class="tab-btn" data-tab="grabbed"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>我接的</button>
      <button class="tab-btn" data-tab="coupons"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.41l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41s-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>券包</button>
      <button class="tab-btn" data-tab="publish"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>发布</button>
    </nav>
    <!-- 悬浮发布按钮（除发布页外常驻，强化主 CTA） -->
    <button id="fabPublish" class="fab" title="发布需求">＋</button>
  </div>

  <!-- 聊天弹层 -->
  <div id="chatMask" class="modal-mask" style="display:none">
    <div class="chat-panel">
      <div class="chat-head">
        <div id="chatTitle" class="chat-title">沟通</div>
        <button id="chatClose" class="btn-ghost">✕</button>
      </div>
      <div id="chatBody" class="chat-body"></div>
      <div id="chatUploads" class="chat-uploads" style="display:none"></div>
      <div id="chatEmojiPanel" class="emoji-panel" style="display:none"></div>
      <div class="chat-toolbar">
        <button id="btnChatEmoji" class="chat-tool" title="表情">😊</button>
        <button id="btnChatAttach" class="chat-tool" title="发送图片/文件">📎</button>
        <input id="chatFile" type="file" accept="image/*,.pdf,.psd,.ai,.eps,.zip" multiple style="display:none" />
      </div>
      <div class="chat-input">
        <input id="chatText" type="text" placeholder="输入消息…" />
        <button id="chatSend" class="btn btn-primary">发送</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none"></div>

  <!-- 详情抽屉（点卡片打开） -->
  <div id="detailMask" class="modal-mask" style="display:none">
    <div class="drawer">
      <div class="drawer-head">
        <div class="drawer-title-row">
          <span id="detailStatus" class="status-pill"></span>
          <span id="detailTitle" class="drawer-title"></span>
        </div>
        <button id="detailClose" class="btn-ghost">✕</button>
      </div>
      <div id="detailBody" class="drawer-body"></div>
      <div id="detailActions" class="drawer-actions"></div>
    </div>
  </div>

  <!-- 会话列表（Inbox） -->
  <div id="inboxMask" class="modal-mask" style="display:none">
    <div class="drawer">
      <div class="drawer-head">
        <div class="drawer-title">我的消息</div>
        <button id="inboxClose" class="btn-ghost">✕</button>
      </div>
      <div id="inboxBody" class="drawer-body"></div>
    </div>
  </div>

  <!-- 图片放大预览 -->
  <div id="lightbox" class="lightbox" style="display:none">
    <img id="lightboxImg" class="lightbox-img" src="" alt="" />
    <button id="lightboxClose" class="lightbox-close" title="关闭">✕</button>
  </div>

  <!-- 未读消息悬浮提示 -->
  <div id="msgToast" class="msg-toast" style="display:none"></div>

  <!-- 抢单平台独立缓存版本：改前端发版时请把 ?vN 同步 +1 -->
  <script src="vendor/supabase.js?lib1"></script>
  <script src="js/config.js?v44"></script>
  <script src="js/db.js?v44"></script>
  <script src="js/app.js?v44"></script>
</body>
</html>
